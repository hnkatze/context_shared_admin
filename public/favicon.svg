<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Boardroom">
  <!-- Three process plates out of register, the same construction the panel uses for its
       display numerals. The dark core is the C x M x K multiply overlap; the coloured
       fringes are the misregistration. Paper ground so the multiply has a backdrop. -->
  <rect width="32" height="32" fill="#f3f2f2"/>
  <g style="mix-blend-mode:multiply">
    <rect x="5" y="4" width="20" height="24" fill="#0088b0"/>
    <rect x="8" y="6" width="20" height="24" fill="#d6006c"/>
    <rect x="6.5" y="5" width="20" height="24" fill="#201e1d"/>
  </g>
  <!-- The gutter: what makes it read as a printed sheet rather than a filled square. -->
  <rect x="15" y="4" width="1.4" height="26" fill="#f3f2f2"/>
</svg>
